name: Build Ninja EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyinstaller
          pip install -r app/requirements.txt

      - name: Build EXE (Native GUI)
        run: |
          cd bootstrap
          pyinstaller --onefile --noconsole --name ninja --icon=../app/icon.ico --add-data "../app/ninja_gui.py;." --add-data "../app/requirements.txt;." launcher.py
        continue-on-error: true

      - name: Build EXE (Fallback without icon)
        if: failure()
        run: |
          cd bootstrap
          pyinstaller --onefile --noconsole --name ninja launcher.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ninja-exe
          path: bootstrap/dist/ninja.exe

      - name: Create Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          files: bootstrap/dist/ninja.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
